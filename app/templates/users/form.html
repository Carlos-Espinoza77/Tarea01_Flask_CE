{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form action="{{ action }}" method="post">
    <div class="field">
        <label for="dni">DNI</label>
        <input id="dni" name="dni" type="text" value="{{ user.dni if user else '' }}" required>
    </div>
    <div class="field">
        <label for="given_name">Nombre</label>
        <input id="given_name" name="given_name" type="text" value="{{ user.given_name if user else '' }}" required>
    </div>
    <div class="field">
        <label for="family_name">Apellido</label>
        <input id="family_name" name="family_name" type="text" value="{{ user.family_name if user else '' }}" required>
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ user.email if user else '' }}" required>
    </div>
    <div class="field">
        <label for="phone_number">Teléfono</label>
        <input id="phone_number" name="phone_number" type="text" value="{{ user.phone_number if user else '' }}">
    </div>
    <div class="field">
        <label for="address">Dirección</label>
        <textarea id="address" name="address">{{ user.address if user else '' }}</textarea>
    </div>
    <button type="submit">Guardar</button>
</form>
{% endblock %}
